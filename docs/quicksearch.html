    {"sources_TMongooseController.js.html":{"id":"sources_TMongooseController.js.html","title":"Source: sources/TMongooseController.js","body":" Itee-MongoDB Classes TMongooseController Source: sources/TMongooseController.js /** * @author [Tristan Valcke]{@link https://github.com/Itee} * @license [BSD-3-Clause]{@link https://opensource.org/licenses/BSD-3-Clause} * * @class TMongooseController * @classdesc The TMongooseController is the base class to perform CRUD operations on the database */ import { TAbstractDataController } from 'itee-database' import { isEmptyArray, isNull, isUndefined } from 'itee-validators' import Mongoose from 'mongoose' class TMongooseController extends TAbstractDataController { constructor( parameters = {} ) { const _parameters = { ...{ schemaName: '' }, ...parameters, ...{ driver: Mongoose } } super( _parameters ) this.databaseSchema = this._driver.model( _parameters.schemaName ) } get databaseSchema() { return this._databaseSchema } set databaseSchema( value ) { if ( isNull( value ) ) { throw new TypeError( 'Database schema cannot be null.' ) } if ( isUndefined( value ) ) { throw new TypeError( 'Database schema cannot be undefined.' ) } this._databaseSchema = value } setDatabaseSchema( value ) { this.databaseSchema = value return this } _createMany( datas, response ) { super._createMany( datas, response ) this._databaseSchema.create( datas, this.return( response ) ) } // Create _createOne( data, response ) { super._createOne( data, response ) this._databaseSchema.create( data, this.return( response ) ) } _deleteAll( response ) { super._deleteAll( response ) this._databaseSchema.collection.drop( TMongooseController.return( response ) ) } _deleteMany( ids, response ) { super._deleteMany( ids, response ) this._databaseSchema.deleteMany( { '_id': { $in: ids } }, this.return( response ) ) } // Delete _deleteOne( id, response ) { super._deleteOne( id, response ) this._databaseSchema .findByIdAndDelete( id ) .then( data =&gt; TMongooseController.returnData( data, response ) ) .catch( error =&gt; TMongooseController.returnError( error, response ) ) } _deleteWhere( query, response ) { super._deleteWhere( query, response ) this._databaseSchema.deleteMany( query, this.return( response ) ) } _readAll( projection, response ) { super._readAll( projection, response ) this._databaseSchema .find( {}, projection ) .lean() .exec() .then( data =&gt; TMongooseController.returnData( data, response ) ) .catch( error =&gt; TMongooseController.returnError( error, response ) ) } _readMany( ids, projection, response ) { super._readMany( ids, projection, response ) this._databaseSchema .find( { '_id': { $in: ids } }, projection ) .lean() .exec() .then( ( data ) =&gt; { if ( isNull( data ) || isEmptyArray( data ) ) { TMongooseController.returnNotFound( response ) } else if ( ids.length !== data.length ) { TMongooseController.returnErrorAndData( { title: 'Missing data', message: 'Some requested objects could not be found.' }, data, response ) } else { TMongooseController.returnData( data, response ) } } ) .catch( error =&gt; TMongooseController.returnError( error, response ) ) } // Read _readOne( id, projection, response ) { super._readOne( id, projection, response ) this._databaseSchema .findById( id, projection ) .lean() .exec() .then( ( data ) =&gt; { if ( isNull( data ) ) { TMongooseController.returnNotFound( response ) } else { TMongooseController.returnData( data, response ) } } ) .catch( error =&gt; TMongooseController.returnError( error, response ) ) } _readWhere( query, projection, response ) { super._readWhere( query, projection, response ) this._databaseSchema .find( query, projection ) .lean() .exec() .then( data =&gt; TMongooseController.returnData( data, response ) ) .catch( error =&gt; TMongooseController.returnError( error, response ) ) } _updateAll( update, response ) { super._updateAll( update, response ) this._databaseSchema.update( {}, update, { multi: true }, TMongooseController.return( response ) ) } _updateMany( ids, updates, response ) { super._updateMany( ids, updates, response ) this._databaseSchema.update( { _id: { $in: ids } }, updates, { multi: true }, TMongooseController.return( response ) ) } // Update _updateOne( id, update, response ) { super._updateOne( id, update, response ) this._databaseSchema .findByIdAndUpdate( id, update ) .exec() .then( data =&gt; TMongooseController.returnData( data, response ) ) .catch( error =&gt; TMongooseController.returnError( error, response ) ) } _updateWhere( query, update, response ) { super._updateWhere( query, update, response ) this._databaseSchema.update( query, update, { multi: true }, TMongooseController.return( response ) ) } } export { TMongooseController } × Search results Close "},"gulpfile.mjs.html":{"id":"gulpfile.mjs.html","title":"Source: gulpfile.mjs","body":" Itee-MongoDB Classes TMongooseController Source: gulpfile.mjs /** * This file is auto-generated by internal gulp command. * If you want to customize the available gulp tasks, create your own in .tasks folder * and run \"gulp refresh\" */ export * from './.tasks/.tests/run-tests.task.mjs' export * from './.tasks/.tests/build-tests.task.mjs' export * from './.tasks/.tests/unit-tests/run-unit-tests.task.mjs' export * from './.tasks/.tests/unit-tests/run-unit-tests-for-backend.task.mjs' export * from './.tasks/.tests/unit-tests/compute-unit-tests.task.mjs' export * from './.tasks/.tests/unit-tests/build-unit-tests.task.mjs' export * from './.tasks/.tests/unit-tests/build-unit-tests-backend.task.mjs' export * from './.tasks/.tests/bundling/check-bundling.task.mjs' export * from './.tasks/.tests/bundling/check-bundling-from-esm-files-import.task.mjs' export * from './.tasks/.tests/bundling/check-bundling-from-esm-files-direct.task.mjs' export * from './.tasks/.tests/bundling/check-bundling-from-esm-build-import.task.mjs' export * from './.tasks/.tests/benchmarks/run-benchmarks.task.mjs' export * from './.tasks/.tests/benchmarks/run-benchmarks-for-backend.tas  ) =&gt; { this.logger.error( err ) } ) } init() { super.init() } on( eventName, callback ) { const availableEventNames = [ 'connecting', 'connected', 'open', 'disconnecting', 'disconnected', 'reconnected', 'close', 'error' ] if ( availableEventNames.indexOf( eventName ) === -1 ) { return } this._driver.connection.on( eventName, callback ) } } export { TMongoDBDatabase } × Search results Close "},"sources_TMongoDBPlugin.js.html":{"id":"sources_TMongoDBPlugin.js.html","title":"Source: sources/TMongoDBPlugin.js","body":" Itee-MongoDB Classes TMongooseController Source: sources/TMongoDBPlugin.js /** * @author [Tristan Valcke]{@link https://github.com/Itee} * @license [BSD-3-Clause]{@link https://opensource.org/licenses/BSD-3-Clause} * * @file Todo * * @example Todo * */ import { TAbstractDatabasePlugin } from 'itee-database' import { getFilesPathsUnder } from 'itee-utils' import { isFunction } from 'itee-validators/sources/cores/functions/isFunction' import { isInvalidDirectoryPath } from 'itee-validators/sources/file-system/directories/isValidDirectoryPath' import { isEmptyFile } from 'itee-validators/sources/file-system/files/isEmptyFile' import { join } from 'path' class TMongoDBPlugin extends TAbstractDatabasePlugin { constructor( parameters = {} ) { const _parameters = { ...{ types: [], schemas: [] }, ...parameters } super( _parameters ) this.types = _parameters.types this.schemas = _parameters.schemas } get schemas() { return this._schemas } set schemas( value ) { this._schemas = value } get types() { return this._types } set types( value ) { this._types = value } addSchema( value ) { this._schemas.push( value ) return this } addType( value ) { this._types.push( value ) return this } beforeRegisterRoutes( Mongoose ) { super.beforeRegisterRoutes( Mongoose ) this._searchLocalTypes() this._registerTypes( Mongoose ) this._searchLocalSchemas() this._registerSchemas( Mongoose ) } _searchLocalTypes() { const typesBasePath = join( this.__dirname, 'types' ) if ( isInvalidDirectoryPath( typesBasePath ) ) { this.logger.warn( `Unable to find \"types\" folder for path \"${ typesBasePath }\"` ) return } else { this.logger.log( `Add types from: ${ typesBasePath }` ) } const typesFilesPaths = getFilesPathsUnder( typesBasePath ) let typeFilePath = '' let typeFile = undefined for ( let typeIndex = 0, numberOfTypes = typesFilesPaths.length ; typeIndex &lt; numberOfTypes ; typeIndex++ ) { typeFilePath = typesFilesPaths[ typeIndex ] typeFile = require( typeFilePath ) this._types.push( typeFile ) } } _registerTypes( Mongoose ) { for ( let type of this._types ) { this.logger.log( `Register type: ${ type.name }` ) type( Mongoose ) } } _searchLocalSchemas() { const localSchemasBasePath = join( this.__dirname, 'schemas' ) if ( isInvalidDirectoryPath( localSchemasBasePath ) ) { this.logger.warn( `Unable to find \"schemas\" folder for path \"${ localSchemasBasePath }\"` ) return } else { this.logger.log( `Add schemas from: ${ localSchemasBasePath }` ) } const localSchemasFilesPaths = getFilesPathsUnder( localSchemasBasePath ) let localSchemaFilePath = '' let localSchemaFile = undefined for ( let schemaIndex = 0, numberOfSchemas = localSchemasFilesPaths.length ; schemaIndex &lt; numberOfSchemas ; schemaIndex++ ) { localSchemaFilePath = localSchemasFilesPaths[ schemaIndex ] if ( isEmptyFile( localSchemaFilePath ) ) { this.logger.warn( `Skip empty local database schema: ${ localSchemaFilePath }` ) continue } localSchemaFile = require( localSchemaFilePath ) this._schemas.push( localSchemaFile ) } } _registerSchemas( Mongoose ) { for ( let schema of this._schemas ) { this.logger.log( `Register schema: ${ schema.name }` ) if ( isFunction( schema.registerModelTo ) ) { schema.registerModelTo( Mongoose ) } else if ( isFunction( schema ) ) { schema( Mongoose ) } else { this.logger.error( `Unable to register local database schema: ${ schema }` ) } } } } export { TMongoDBPlugin } × Search results Close "},"sources_itee-mongodb.js.html":{"id":"sources_itee-mongodb
